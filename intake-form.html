<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#141414" />
<title>Client onboarding (FICA) — Albert Hibbert Inc Attorneys</title>
<style>
  :root {
    --ink: #141414; --ink-2: #3a3a37; --muted: #6b6b66; --faint: #9a9a94;
    --line: #e2e0da; --line-2: #cfccc4; --bg: #f3f2ee; --card: #ffffff; --soft: #f8f7f4;
    --red: #a4161a; --red-dark: #7f1014; --red-soft: #fbefef;
    --ok: #2f6b1f; --ok-soft: #edf5e6; --ok-line: #9cc47f;
    --warn: #7a4f00; --warn-soft: #fdf6e3; --warn-line: #e6c36a;
    --info: #1d4f7a; --info-soft: #ecf3fa; --info-line: #9cc0e3;
    --radius: 10px;
    --serif: Georgia, "Times New Roman", Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--red); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Masthead */
  .masthead { background: var(--ink); color: #fff; border-bottom: 3px solid var(--red); }
  .mast-inner { max-width: 720px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
  .brand-mark { width: 40px; height: 40px; border: 1.5px solid #fff; display: grid; place-items: center; font-family: var(--serif); font-size: 17px; letter-spacing: .04em; flex-shrink: 0; }
  .brand-name { font-family: var(--serif); font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
  .brand-sub { font-size: 12px; color: #bdbdb7; letter-spacing: .04em; }
  .mast-ref { margin-left: auto; font-size: 12px; color: #d9d9d4; border: 1px solid #4a4a46; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

  .page { max-width: 720px; margin: 0 auto; padding: 22px 16px 48px; }

  /* Stepper */
  .stepper { display: flex; margin: 4px 0 22px; counter-reset: s; }
  .stp { flex: 1; text-align: center; position: relative; font-size: 11px; color: var(--faint); }
  .stp::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
  .stp:first-child::before { display: none; }
  .stp.done::before, .stp.active::before { background: var(--red); }
  .stp .dot { position: relative; z-index: 1; width: 28px; height: 28px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1.5px solid var(--line-2); font-weight: 600; font-size: 12px; color: var(--faint); }
  .stp.active .dot { background: var(--ink); border-color: var(--ink); color: #fff; }
  .stp.done .dot { background: var(--red); border-color: var(--red); color: #fff; }
  .stp.active { color: var(--ink); font-weight: 600; }
  .stp button { all: unset; cursor: pointer; display: block; }
  .stp button:focus-visible .dot { outline: 2px solid var(--red); outline-offset: 2px; }
  .step-compact { display: none; font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .step-compact strong { color: var(--ink); }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 8px; display: none; }
  .bar > span { display: block; height: 100%; background: var(--red); transition: width .3s; }

  h1 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.25; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 18px; }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .card .card-sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card.center { text-align: center; padding: 40px 20px; }

  /* Notices */
  .notice { border-radius: 8px; padding: 11px 14px; font-size: 13px; margin: 0 0 14px; border: 1px solid var(--info-line); background: var(--info-soft); color: var(--info); }
  .notice.warn { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn); }
  .notice.err { border-color: #e3a0a2; background: var(--red-soft); color: var(--red-dark); }
  .notice.ok { border-color: var(--ok-line); background: var(--ok-soft); color: var(--ok); }
  .notice ul { margin: 6px 0 0; padding-left: 18px; }

  /* Fields */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .grid .full { grid-column: 1 / -1; }
  .field { margin-bottom: 14px; min-width: 0; }
  .field > label, fieldset > legend { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; padding: 0; }
  .req { color: var(--red); margin-left: 2px; }
  .opt { color: var(--faint); font-weight: 400; font-size: 12px; margin-left: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin: -2px 0 6px; }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #777 50%), linear-gradient(135deg, #777 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  textarea { resize: vertical; min-height: 84px; }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(20,20,20,.08); }
  .err-msg { display: none; font-size: 12px; color: var(--red); margin-top: 4px; }
  .has-error input, .has-error select, .has-error textarea { border-color: var(--red); }
  .has-error .err-msg { display: block; }
  .has-error > .choice-group .choice { border-color: #e3a0a2; }
  .ok-msg { font-size: 12px; color: var(--ok); margin-top: 4px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  /* Choices (real radios / checkboxes) */
  .choice-group { display: grid; gap: 8px; }
  .choice-group.inline { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .choice { position: relative; display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: #fff; transition: border-color .12s, background .12s; }
  .choice:hover { background: var(--soft); }
  .choice input { margin: 3px 0 0; width: 17px; height: 17px; accent-color: var(--ink); flex-shrink: 0; }
  .choice:has(input:checked) { border-color: var(--ink); background: var(--soft); }
  .choice:has(input:focus-visible) { box-shadow: 0 0 0 3px rgba(164,22,26,.25); }
  .choice-title { font-weight: 600; font-size: 14px; }
  .choice-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .type-grid { grid-template-columns: 1fr 1fr; }
  .type-grid .choice { padding: 14px; }

  .check { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); background: #fff; margin-bottom: 8px; }
  .field > label.check { display: flex; font-weight: 400; font-size: 13px; color: var(--ink-2); margin-bottom: 0; }
  .check input { margin: 2px 0 0; width: 17px; height: 17px; accent-color: var(--ink); flex-shrink: 0; }
  .check:has(input:checked) { border-color: var(--ink); background: var(--soft); }
  .has-error .check { border-color: #e3a0a2; }

  details.more { font-size: 13px; color: var(--ink-2); margin: -4px 0 12px; }
  details.more summary { cursor: pointer; color: var(--red); font-weight: 600; }
  details.more div { padding: 8px 0 0; }

  /* People */
  .person { border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 2px; margin-bottom: 10px; background: var(--soft); }
  .person-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: 650; }
  .roles { display: flex; flex-wrap: wrap; gap: 6px; }
  .role { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 20px; background: #fff; font-size: 12.5px; cursor: pointer; }
  .role input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
  .role:has(input:checked) { border-color: var(--ink); background: var(--ink); color: #fff; }

  /* Uploads */
  .doc { padding: 14px 0; border-top: 1px solid var(--line); }
  .doc:first-of-type { border-top: 0; padding-top: 0; }
  .doc-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .doc-title { font-weight: 600; font-size: 14px; }
  .drop { position: relative; margin-top: 8px; border: 1.5px dashed var(--line-2); border-radius: 8px; padding: 14px; text-align: center; background: var(--soft); font-size: 13px; color: var(--muted); transition: background .12s, border-color .12s; }
  .drop:hover, .drop:focus-within { background: #efeee9; border-color: var(--ink); }
  .drop input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .drop strong { color: var(--ink); }
  .file { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--ok-soft); border: 1px solid var(--ok-line); font-size: 13px; color: var(--ok); }
  .file .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .file .fsize { color: #5c7d4c; font-size: 12px; white-space: nowrap; }
  .later { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 8px; cursor: pointer; }
  .later input { accent-color: var(--ink); }
  .meter { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .meter .track { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .meter .track span { display: block; height: 100%; background: var(--ink); }

  /* Agreement */
  .agreement { border: 1px solid var(--line); border-radius: 8px; background: var(--soft); max-height: 420px; overflow-y: auto; padding: 18px; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }
  .agreement h3 { font-family: var(--serif); font-weight: 400; font-size: 18px; text-align: center; letter-spacing: .06em; margin: 0 0 14px; color: var(--ink); }
  .agreement h4 { font-size: 13px; letter-spacing: .04em; margin: 16px 0 4px; color: var(--ink); }
  .agreement p { margin: 0 0 8px; }
  .agreement .hl { background: #fff4c2; padding: 1px 2px; }
  table.rates { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0 10px; background: #fff; }
  table.rates th { background: var(--ink); color: #fff; font-weight: 600; text-align: left; padding: 7px 8px; }
  table.rates td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.rates td + td, table.rates th + th { text-align: right; white-space: nowrap; }
  .sig-preview { margin-top: 8px; padding: 12px 14px; border: 1px dashed var(--line-2); border-radius: 8px; background: #fff; }
  .sig-preview .sig { font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", cursive; font-size: 26px; color: #0d2a52; line-height: 1.2; min-height: 32px; }
  .sig-preview .sig-meta { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }

  /* Review */
  .rev { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .rev-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 650; }
  .rev dl { margin: 0; padding: 6px 14px 10px; display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 6px 12px; font-size: 13px; }
  .rev dt { color: var(--muted); }
  .rev dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; white-space: pre-line; }
  .linkbtn { all: unset; cursor: pointer; color: var(--red); font-size: 12.5px; font-weight: 600; }
  .linkbtn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .privacy { max-height: 260px; overflow-y: auto; font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--soft); margin-bottom: 12px; }
  .privacy p { margin: 0 0 8px; }

  /* Buttons */
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 46px; }
  .btn:hover { background: var(--soft); }
  .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-primary:hover { background: #2b2b28; }
  .btn-red { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-red:hover { background: var(--red-dark); }
  .btn[disabled] { opacity: .5; cursor: progress; }
  .btn-sm { padding: 6px 12px; min-height: 0; font-size: 13px; }
  .btn-x { all: unset; cursor: pointer; font-size: 12.5px; color: inherit; text-decoration: underline; }
  .btn-x:focus-visible { outline: 2px solid var(--red); }

  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--red); border-radius: 50%; margin: 0 auto 14px; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .big-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; font-size: 30px; }
  .big-icon.ok { background: var(--ok-soft); color: var(--ok); }
  .big-icon.bad { background: var(--red-soft); color: var(--red); }
  .receipt { text-align: left; max-width: 360px; margin: 18px auto; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: 13px; }
  .receipt div { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
  .receipt span:first-child { color: var(--muted); }
  .receipt span:last-child { font-weight: 600; text-align: right; }

  footer.foot { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
  footer.foot .btn-x { color: var(--muted); }

  @media (max-width: 600px) {
    .brand-name { letter-spacing: .04em; }
    table.rates { font-size: 11.5px; }
    table.rates td, table.rates th { padding: 6px 5px; }
    table.rates td + td, table.rates th + th { white-space: normal; }
    .agreement { padding: 14px; }
    .grid, .type-grid { grid-template-columns: 1fr; }
    .stepper { display: none; }
    .step-compact, .bar { display: block; }
    h1 { font-size: 22px; }
    .card { padding: 16px; }
    .brand-name { font-size: 14px; }
    .mast-inner { padding: 14px 16px; }
    .nav .btn { flex: 1; }
    .rev dl { grid-template-columns: 1fr; gap: 0 0; }
    .rev dd { margin-bottom: 8px; }
  }
  @media print {
    .masthead, .stepper, .nav, footer.foot, .bar, .step-compact { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>

  // ============================================================
  //  HELPERS

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function val(k) { var v = S.f[k]; return v == null ? "" : String(v); }
  function has(k) { return val(k).trim() !== ""; }
  function isEntity() { return !!(TYPES[S.type] && TYPES[S.type].entity); }
  function fmtSize(b) { return b >= MB ? (b / MB).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
  function totalBytes() {
    var n = 0; Object.keys(S.uploads).forEach(function (k) { S.uploads[k].forEach(function (u) { n += u.size; }); }); return n;
  }
  function today() { return new Date().toLocaleDateString("en-ZA", { day: "numeric", month: "long", year: "numeric" }); }
  function nowStamp(d) {
    d = d || new Date();
    return d.toLocaleString("en-ZA", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  }
  function makeSubmissionId() {
    var d = new Date(), chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = "";
    var a = new Uint8Array(5);
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (var i = 0; i < a.length; i++) r += chars[a[i] % chars.length];
    return "AH-" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "-" + r;
  }
  function addressOf(prefix) {
    return [val(prefix + "Street"), val(prefix + "Suburb"), val(prefix + "City"), val(prefix + "Province"), val(prefix + "Postal")]
      .map(function (s) { return s.trim(); }).filter(Boolean).join(", ");
  }
  function clientDisplayName() {
    return isEntity() ? val("entityName").trim() : (val("firstName") + " " + val("lastName")).trim();
  }
  function signerName() {
    return isEntity() ? (val("repFirst") + " " + val("repLast")).trim() : (val("firstName") + " " + val("lastName")).trim();
  }
  function signerSurname() { return (isEntity() ? val("repLast") : val("lastName")).trim(); }

  // South African ID: 13 digits, YYMMDD, Luhn check digit
  function parseSAID(raw) {
    var id = String(raw || "").replace(/\s+/g, "");
    if (!/^\d{13}$/.test(id)) return null;
    var sum = 0;
    for (var i = 0; i < 13; i++) {
      var d = +id[12 - i];
      if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
      sum += d;
    }
    if (sum % 10 !== 0) return null;
    var yy = +id.substr(0, 2), mm = +id.substr(2, 2), dd = +id.substr(4, 2);
    var cy = new Date().getFullYear() % 100;
    var yyyy = (yy > cy ? 1900 : 2000) + yy;
    var dt = new Date(yyyy, mm - 1, dd);
    if (dt.getFullYear() !== yyyy || dt.getMonth() !== mm - 1 || dt.getDate() !== dd) return null;
    return { dob: yyyy + "-" + String(mm).padStart(2, "0") + "-" + String(dd).padStart(2, "0"), citizen: id[10] === "0" ? "SA citizen" : "Permanent resident" };
  }
  function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e).trim()); }
  function validPhone(p) { var d = String(p).replace(/[^\d]/g, ""); return d.length >= 9 && d.length <= 15; }

  // ============================================================
  //  DRAFT (sessionStorage — cleared when the tab closes or on submit)
  // ============================================================
  function saveDraft() {
    if (S.walkIn) return; // shared reception devices: never keep one client's details for the next
    try {
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ token: S.token, step: S.step, type: S.type, f: S.f, people: S.people, later: S.later }));
    } catch (e) { /* storage unavailable — ignore */ }
  }
  function loadDraft() {
    try {
      if (S.walkIn) return false;
      var d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null");
      if (!d || d.token !== S.token) return false;
      S.step = Math.min(d.step || 0, 4); S.type = d.type || S.type; S.f = d.f || {}; S.people = d.people || []; S.later = d.later || {};
      return true;
    } catch (e) { return false; }
  }
  function clearDraft() { try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  function lbl(text, req) { return esc(text) + (req ? '<span class="req" aria-hidden="true">*</span>' : '<span class="opt">(optional)</span>'); }

    } else if (o.type === "textarea") {
      ctl = "<textarea" + common + ' rows="' + (o.rows || 3) + '" placeholder="' + esc(o.ph || "") + '" maxlength="' + (o.max || 3000) + '">' + esc(v) + "</textarea>";
    } else {
      ctl = '<input type="' + (o.type || "text") + '"' + common + ' value="' + esc(v) + '" placeholder="' + esc(o.ph || "") + '"' +
        (o.ac ? ' autocomplete="' + o.ac + '"' : "") + (o.im ? ' inputmode="' + o.im + '"' : "") + ' maxlength="' + (o.max || 200) + '" />';
    }
    return '<div class="field' + (o.full ? " full" : "") + (err ? " has-error" : "") + '" data-field="' + k + '">' +

  // ============================================================
  //  VALIDATION
  // ============================================================
  function validate(step) {
    var e = {}, t = S.type;
    function need(k, m) { if (!has(k)) e[k] = m || "This field is required."; }
    if (step === 0 && !t) e.type = "Please choose the type of client.";
    if (step === 1) {
      if (t === "individual") {
        need("firstName"); need("lastName"); need("citizenship", "Please choose one.");
        if (val("citizenship") === "foreign") { need("passportNumber"); need("nationality"); }
        else if (val("citizenship") === "sa") {
          if (!has("idNumber")) e.idNumber = "This field is required.";
          else if (!parseSAID(val("idNumber"))) e.idNumber = "This is not a valid South African ID number — please check the digits.";
        }
        need("dob");
        var p = parseSAID(val("idNumber"));
        if (val("citizenship") === "sa" && p && has("dob") && p.dob !== val("dob")) e.dob = "This does not match the date of birth in your ID number (" + p.dob + ").";
        need("occupation");
      } else {
        need("entityName");
        if (TYPES[t].regReq) need("regNumber");
        if (t === "trust") { need("mastersOffice"); need("trustType"); }
        need("natureOfBusiness");
        need("repFirst"); need("repLast"); need("repId"); need("repCapacity");
        var filled = S.people.filter(function (x) { return (x.name || "").trim() || (x.idNo || "").trim(); });
        if (!filled.length) e.people = "Please list at least one person.";
        S.people.forEach(function (x, i) {
          var any = (x.name || "").trim() || (x.idNo || "").trim() || x.roles.length;
          if (!any && S.people.length > 1) return;
          if (!(x.name || "").trim()) e["p_" + i + "_name"] = "Required.";
          if (!(x.idNo || "").trim()) e["p_" + i + "_idNo"] = "Required.";
          if (!x.roles.length) e["p_" + i + "_roles"] = "Choose at least one role.";
        });
      }
      need("addrStreet"); need("addrCity"); need("addrProvince"); need("addrPostal");
      if (!has("email")) e.email = "This field is required."; else if (!validEmail(val("email"))) e.email = "Please enter a valid email address.";
      if (!has("phone")) e.phone = "This field is required."; else if (!validPhone(val("phone"))) e.phone = "Please enter a valid phone number.";
    }
    if (step === 2) {
      need("serviceType"); need("matterDesc"); need("trustFunds", "Please choose one.");
      if (val("trustFunds") === "yes") { need("sourceOfFunds"); need("sourceDetails"); }
      need("pep", "Please choose one."); if (val("pep") === "yes") need("pepDetails");
      need("actingForOther", "Please choose one."); if (val("actingForOther") === "yes") need("actingForDetails");
    }
    if (step === 3) {
      docSlots().forEach(function (d) {
        if (d.req && !(S.uploads[d.id] || []).length && !S.later[d.id]) e["doc_" + d.id] = "Please upload this document, or tick that you will send it later.";
      });
    }
    if (step === 4) {
      if (S.f.ackRead !== true) e.ackRead = "Please confirm that you have read the agreement.";
      if (S.f.ackLiability !== true) e.ackLiability = "Please acknowledge clause 8.";
      if (isEntity() && S.f.ackAuthorised !== true) e.ackAuthorised = "Please confirm your authority to sign.";
      var sig = val("feeSignature").trim(), sur = signerSurname().toLowerCase();
      if (sig.length < 4) e.feeSignature = "Please type your full name.";
      else if (sur && sig.toLowerCase().indexOf(sur) === -1) e.feeSignature = "Your signature must include your surname (" + signerSurname() + ").";
    }
    if (step === 5) {
      if (S.f.declTrue !== true) e.declTrue = "Please confirm this declaration.";
      if (S.f.declPrivacy !== true) e.declPrivacy = "Please confirm this statement.";
    }
    return e;
  }

  // ============================================================
  //  FILES
  // ============================================================
  function readAsBase64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(",")[1] || ""); };
      r.onerror = function () { rej(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function loadImage(file) {
    if (window.createImageBitmap) return createImageBitmap(file, { imageOrientation: "from-image" }).catch(function () { return createImageBitmap(file); });
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () { URL.revokeObjectURL(url); res(img); };
      img.onerror = rej; img.src = url;
    });
  }
  function compressImage(file) {
    return loadImage(file).then(function (img) {
      var w = img.width, h = img.height, max = CONFIG.IMAGE_MAX_PX, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
      var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function (res) { c.toBlob(function (b) { res(b); }, "image/jpeg", 0.85); });
    });
  }
  function addFiles(slot, list) {
    var files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    S.busy[slot] = true; S.upMsg[slot] = ""; render();
    var problems = [];
    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
        var isImg = /^image\/(jpeg|png)$/.test(file.type) || /\.(jpe?g|png)$/i.test(file.name);
        if (!isPdf && !isImg) { problems.push(file.name + ": only PDF, JPG or PNG files are accepted."); return; }
        var type = isPdf ? "application/pdf" : (file.type || (/\.png$/i.test(file.name) ? "image/png" : "image/jpeg"));
        var p = Promise.resolve({ blob: file, name: file.name, type: type });
        if (isImg && file.size > CONFIG.COMPRESS_OVER_MB * MB) {
          p = compressImage(file).then(function (b) {
            if (b && b.size < file.size) return { blob: b, name: file.name.replace(/\.[^.]+$/, "") + ".jpg", type: "image/jpeg" };
            return { blob: file, name: file.name, type: type };
          }).catch(function () { return { blob: file, name: file.name, type: type }; });
        }
        return p.then(function (r) {
          if (r.blob.size > CONFIG.MAX_FILE_MB * MB) { problems.push(file.name + " is larger than " + CONFIG.MAX_FILE_MB + " MB. Please upload a smaller copy or scan."); return; }
          if (totalBytes() + r.blob.size > CONFIG.MAX_TOTAL_MB * MB) { problems.push(file.name + ": the total of all files may not exceed " + CONFIG.MAX_TOTAL_MB + " MB. Please email larger documents to " + CONFIG.FIRM_EMAIL + "."); return; }
          return readAsBase64(r.blob).then(function (data) {
            (S.uploads[slot] = S.uploads[slot] || []).push({ name: r.name, orig: file.name, type: r.type, size: r.blob.size, data: data });
          });
        });
      }).catch(function () { problems.push(file.name + " could not be read. Please try again."); });
    });
    chain.then(function () {
      S.busy[slot] = false; S.upMsg[slot] = problems.join(" ");
      if ((S.uploads[slot] || []).length) { S.later[slot] = false; delete S.errors["doc_" + slot]; }
      render();
    });
  }

  // ============================================================
  //  PAYLOAD
  // ============================================================
  function peopleText() {
    var roles = ROLES[S.type] || [];
    return S.people.filter(function (p) { return (p.name || "").trim(); }).map(function (p) {
      var r = p.roles.map(function (k) { var f = roles.filter(function (x) { return x[0] === k; })[0]; return f ? f[1] : k; }).join(", ");
      return [p.name.trim(), (p.idNo || "").trim(), r, (p.pct || "").trim()].filter(Boolean).join(" — ");
    }).join("\n");
  }

  function summaryText() {
    var lines = ["CLIENT ONBOARDING — " + CONFIG.FIRM, "Submission ID: " + S.submissionId, "Submitted: " + S.submittedAt,
      "Link: " + (S.walkIn ? "Reception / walk-in (no token)" : "Token " + (S.tokenVerified ? "verified" : "NOT verified") + (S.ref ? " · Ref " + S.ref : "")),
      "Client type: " + TYPES[S.type].label, ""];
    reviewRows().forEach(function (s) {
      lines.push(s[0].toUpperCase());
      s[2].forEach(function (r) { if (r[1] != null && String(r[1]).trim()) lines.push("  " + r[0] + ": " + String(r[1]).replace(/\n/g, "\n    ")); });
      lines.push("");
    });
    lines.push("FEE AGREEMENT " + CONFIG.AGREEMENT_VERSION + ": accepted; clause 8 (R2m liability cap) specifically acknowledged" + (isEntity() ? "; signatory confirmed authority" : ""));
    lines.push("Signature: " + val("feeSignature") + " — " + signatureMeta());
    lines.push("Declarations: information true and correct; privacy notice read.");
    return lines.join("\n");
  }

  function buildPayload() {
    var f = S.f, ent = isEntity(), t = S.type, now = new Date();
    var docs = [];
    docSlots().forEach(function (d) {
      (S.uploads[d.id] || []).forEach(function (u, i) {
        var label = d.label.replace(/[^\w\s-]/g, "").replace(/\s+/g, "_");
        docs.push({ name: label + (S.uploads[d.id].length > 1 ? "_" + (i + 1) : "") + "__" + u.name, type: u.type, data: u.data, category: d.id, originalName: u.orig });
      });
    });
    var fullAddress = addressOf("addr");
    var individualId = f.citizenship === "foreign" ? val("passportNumber") : val("idNumber");
    return {
      // ---- fields the existing Apps Script already reads (unchanged names) ----
      action: "submit_fica",
      token: S.token,
      clientType: t,
      firstName: ent ? "" : val("firstName").trim(),
      lastName: ent ? "" : val("lastName").trim(),
      entityName: ent ? val("entityName").trim() : "",
      email: val("email").trim(),
      phone: val("phone").trim(),
      idNumber: ent ? val("regNumber").trim() : individualId.trim(),
      regNumber: ent ? val("regNumber").trim() : "",
      address: fullAddress,
      regAddress: ent ? fullAddress : "",
      occupation: ent ? val("repCapacity").trim() : val("occupation").trim(),
      repTitle: ent ? val("repCapacity").trim() : "",
      beneficialOwners: ent ? peopleText() : "",
      feeSignature: val("feeSignature").trim(),
      feeSignedDate: now.toLocaleDateString("en-ZA"),
      documents: docs,

      // ---- new in v2 ----
      formVersion: CONFIG.FORM_VERSION,
      submissionId: S.submissionId,
      submittedAtISO: now.toISOString(),
      submittedAtLocal: S.submittedAt,
      walkIn: S.walkIn,
      tokenVerified: S.tokenVerified,
      matterRef: S.ref,
      clientDisplayName: clientDisplayName(),
      individual: ent ? null : {
        citizenship: f.citizenship === "foreign" ? "Foreign national" : (parseSAID(val("idNumber")) || {}).citizen || "SA ID holder",
        idNumber: f.citizenship === "foreign" ? "" : val("idNumber").trim(),
        passportNumber: f.citizenship === "foreign" ? val("passportNumber").trim() : "",
        nationality: f.citizenship === "foreign" ? val("nationality").trim() : "South Africa",
        dateOfBirth: val("dob"), occupation: val("occupation").trim(), employer: val("employer").trim()
      },
      entity: ent ? {
        name: val("entityName").trim(), tradingName: val("tradingName").trim(), registrationNumber: val("regNumber").trim(),
        mastersOffice: val("mastersOffice").trim(), trustType: val("trustType"), vatNumber: val("vat").trim(),
        natureOfBusiness: val("natureOfBusiness").trim(),
        operatingAddress: t === "company" ? (f.opSame === true ? fullAddress : val("opAddress").trim()) : "",
        beneficiaryClass: val("beneficiaryClass").trim()
      } : null,
      representative: ent ? { firstName: val("repFirst").trim(), lastName: val("repLast").trim(), idNumber: val("repId").trim(), capacity: val("repCapacity").trim() } : null,
      repFirstName: ent ? val("repFirst").trim() : "",
      repLastName: ent ? val("repLast").trim() : "",
      repIdNumber: ent ? val("repId").trim() : "",
      people: ent ? S.people.filter(function (p) { return (p.name || "").trim(); }).map(function (p) { return { name: p.name.trim(), idNumber: (p.idNo || "").trim(), roles: p.roles.slice(), percentage: (p.pct || "").trim() }; }) : [],
      addressParts: { street: val("addrStreet"), suburb: val("addrSuburb"), city: val("addrCity"), province: val("addrProvince"), postalCode: val("addrPostal") },
      phone2: val("phone2").trim(),
      matter: { type: val("serviceType"), description: val("matterDesc").trim(), otherParties: val("opposingParties").trim() },
      risk: {
        trustAccountFunds: val("trustFunds"), sourceOfFunds: val("sourceOfFunds"), fundsAmount: val("fundsAmount").trim(), sourceDetails: val("sourceDetails").trim(),
        prominentPerson: val("pep"), prominentPersonDetails: val("pepDetails").trim(),
        actingForAnother: val("actingForOther"), actingForDetails: val("actingForDetails").trim()
      },
      outstandingDocuments: outstandingDocs(),
      feeAgreement: {
        version: CONFIG.AGREEMENT_VERSION, signature: val("feeSignature").trim(), signedAtISO: now.toISOString(),
        signatoryName: signerName(), signatoryCapacity: ent ? val("repCapacity").trim() : "Client in person",
        acknowledgedRead: f.ackRead === true, acknowledgedLiabilityCap: f.ackLiability === true, confirmedAuthority: ent ? f.ackAuthorised === true : null
      },
      declarations: { truthful: f.declTrue === true, privacyNoticeRead: f.declPrivacy === true },
      device: { userAgent: navigator.userAgent, language: navigator.language, timeZone: (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "" },
      summaryText: summaryText()
    };
  }

  // ============================================================
  //  SUBMIT
  // ============================================================
  function submit() {
    var e = validate(5); S.errors = e;
    if (Object.keys(e).length) { render(); focusFirstError(); return; }
    // Re-check every earlier step in case something was cleared
    for (var s = 0; s < 5; s++) {
      var es = validate(s);
      if (Object.keys(es).length) { S.step = s; S.errors = es; render(); focusFirstError(); return; }
    }
    if (!S.submissionId) S.submissionId = makeSubmissionId();   // kept on retry so the firm can de-duplicate
    S.submittedAt = nowStamp();
    S.phase = "sending"; S.submitError = ""; render();

    var fd = new FormData();
    fd.append("payload", JSON.stringify(buildPayload()));

    var req = CONFIG.SERVER_CONFIRMS
      ? fetch(CONFIG.SCRIPT_URL, { method: "POST", body: fd }).then(function (r) {
          if (!r.ok) throw new Error("The server responded with an error (" + r.status + ").");
          return r.text().then(function (txt) {
            var d; try { d = JSON.parse(txt); } catch (x) { throw new Error("The server did not confirm receipt."); }
            if (!(d && (d.ok === true || d.success === true || d.status === "success"))) throw new Error((d && (d.message || d.error)) || "The server did not confirm receipt.");
          });
        })
      : fetch(CONFIG.SCRIPT_URL, { method: "POST", mode: "no-cors", body: fd }); // opaque response; rejects on network failure

    var timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error("The upload timed out.")); }, 180000); });

    Promise.race([req, timeout]).then(function () {
      S.phase = "done"; clearDraft(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
    }).catch(function (err) {
      S.phase = "form"; S.submitError = (err && err.message && !/Failed to fetch|NetworkError|Load failed/i.test(err.message)) ? err.message : "We could not reach our server.";
      render(); window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  function downloadReceipt() {
    var html = "<!DOCTYPE html><html lang=\"en-ZA\"><head><meta charset=\"utf-8\"><title>Onboarding copy " + esc(S.submissionId) + "</title><style>" +
      "body{font-family:Georgia,serif;max-width:760px;margin:30px auto;padding:0 20px;color:#141414;line-height:1.55;font-size:14px}h1,h2,h3{font-weight:400}h1{font-size:22px;border-bottom:3px solid #a4161a;padding-bottom:8px}" +
      "h2{font-size:17px;margin-top:28px}h4{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.05em;margin:14px 0 2px}pre{white-space:pre-wrap;font-family:Arial,sans-serif;font-size:12.5px;background:#f6f5f1;padding:14px;border:1px solid #ddd}" +
      "table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{border:1px solid #ddd;padding:5px 7px;text-align:left}th{background:#141414;color:#fff}.sig{font-family:'Segoe Script','Brush Script MT',cursive;font-size:26px;color:#0d2a52}" +
      "@media print{body{margin:0}}</style></head><body>" +
      "<h1>ALBERT HIBBERT INC ATTORNEYS — client onboarding copy</h1>" +
      "<p>Submission ID <strong>" + esc(S.submissionId) + "</strong> · Submitted " + esc(S.submittedAt) + (S.ref ? " · Ref " + esc(S.ref) : "") + "</p>" +
      "<h2>Details submitted</h2><pre>" + esc(summaryText()) + "</pre>" +
      "<h2>Fee agreement (version " + esc(CONFIG.AGREEMENT_VERSION) + ")</h2>" + agreementHtml(true) +
      "<h2>Signature</h2><p class=\"sig\">" + esc(val("feeSignature")) + "</p><p>" + esc(signatureMeta()) + ", in terms of the Electronic Communications and Transactions Act 25 of 2002.</p>" +
      "<p style=\"font-size:12px;color:#666\">This is a copy for your records generated on your device. Albert Hibbert Inc Attorneys · 231 Lange Street, Nieuw Muckleneuk, Pretoria · 012 346 4633</p></body></html>";
    var blob = new Blob([html], { type: "text/html" }), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "Albert-Hibbert-onboarding-" + S.submissionId + ".html";
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ============================================================
  //  EVENTS (delegated)
  // ============================================================
  function onField(e) {
    var el = e.target;
    if (el.dataset.type && e.type === "change") {
      S.type = el.value; S.errors = {}; S.people = []; saveDraft(); render(); return;
    }
    if (el.dataset.k) {
      var k = el.dataset.k;
      S.f[k] = el.type === "checkbox" ? el.checked : el.value;
      if (S.errors[k]) {
        delete S.errors[k];
        var w = $app.querySelector('[data-field="' + k + '"]'); if (w) w.classList.remove("has-error");
        if (!Object.keys(S.errors).length) { var bn = document.getElementById("err-banner"); if (bn) bn.remove(); }
      }
      if (k === "idNumber") {
        var p = parseSAID(el.value), dob = document.getElementById("f_dob");
        if (p && !has("dob")) { S.f.dob = p.dob; if (dob) dob.value = p.dob; }
      }
      if (k === "feeSignature") { var s = document.getElementById("sig-live"); if (s) s.textContent = el.value; }
      saveDraft();
      if ((el.dataset.re || el.type === "checkbox" && k === "opSame") && e.type === "change") {
        var active = document.activeElement && document.activeElement.id;
        render();
        if (active && document.getElementById(active)) document.getElementById(active).focus();
      }
      return;
    }
    if (el.dataset.pi !== undefined) {
      var person = S.people[+el.dataset.pi]; if (!person) return;
      if (el.dataset.role) {
        var r = el.dataset.role, i = person.roles.indexOf(r);
        if (el.checked && i === -1) person.roles.push(r); if (!el.checked && i > -1) person.roles.splice(i, 1);
      } else person[el.dataset.pk] = el.value;
      saveDraft(); return;
    }
    if (el.dataset.later && e.type === "change") { S.later[el.dataset.later] = el.checked; delete S.errors["doc_" + el.dataset.later]; saveDraft(); render(); return; }
    if (el.type === "file" && el.dataset.slot && e.type === "change") { addFiles(el.dataset.slot, el.files); }
  }
  $app.addEventListener("input", onField);
  $app.addEventListener("change", onField);

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act;
    if (S.phase === "sending") return;
    if (a === "next") next();
    else if (a === "back") go(S.step - 1);
    else if (a === "goto") go(+b.dataset.step);
    else if (a === "submit") submit();
    else if (a === "receipt") downloadReceipt();
    else if (a === "addPerson") { S.people.push({ name: "", idNo: "", roles: [], pct: "" }); saveDraft(); render(); var ins = $app.querySelectorAll('[data-pk="name"]'); if (ins.length) ins[ins.length - 1].focus(); }
    else if (a === "delPerson") { S.people.splice(+b.dataset.i, 1); S.errors = {}; saveDraft(); render(); }
    else if (a === "delFile") { (S.uploads[b.dataset.slot] || []).splice(+b.dataset.i, 1); render(); }
    else if (a === "clear") {
      if (S.phase === "sending") return;
      if (!window.confirm("Clear everything you have entered on this form?")) return;
      clearDraft(); S.f = {}; S.people = []; S.uploads = {}; S.later = {}; S.errors = {}; S.step = 0; S.submitError = ""; S.submissionId = "";
      S.type = S.prefType || ""; S.restored = false; S.phase = S.phase === "invalid" ? "invalid" : "form"; render(); window.scrollTo(0, 0);
    }
  });

  // Enter in a text input moves to the next step instead of doing nothing
  $app.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox" && e.target.type !== "radio" && e.target.type !== "file") {
      e.preventDefault(); if (S.step < STEPS.length - 1) next();
    }
  });

  window.addEventListener("beforeunload", function (e) {
    if (S.phase === "sending" || (S.phase === "form" && totalBytes() > 0)) { e.preventDefault(); e.returnValue = ""; }
  });

  // ============================================================
  //  INIT
  // ============================================================
  function readToken() {
    var t = null;
    try { t = new URLSearchParams(window.location.search).get("token"); } catch (x) {}
    if (!t) { var m = window.location.hash.match(/token=([^&]+)/); if (m) { try { t = decodeURIComponent(m[1]); } catch (x) { t = m[1]; } } }
    return t ? String(t).trim() : "";
  }

  function start() {
    S.restored = loadDraft();
    S.phase = "form"; render();
  }

  var tok = readToken();
  if (!tok) {
    S.walkIn = true; S.token = "WALK_IN_" + Date.now(); clearDraft(); start();
  } else {
    S.walkIn = false; S.token = tok; render();
    fetch(CONFIG.SCRIPT_URL + "?token=" + encodeURIComponent(tok))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.valid === false) { S.phase = "invalid"; S.invalidReason = d.reason || "This link has expired or has already been used."; render(); return; }
        S.tokenVerified = !!(d && d.valid);
        S.clientName = (d && d.clientName) || "";
        S.ref = (d && d.ref) || "";
        var ct = String((d && d.clientType) || "").toLowerCase();
        if (TYPES[ct]) { S.type = ct; S.prefType = ct; }
        start();
      })
      .catch(function () {
        // Could not check the link (offline or script error). Let the client continue;
        // the submission is flagged tokenVerified:false for the firm to check.
        S.tokenVerified = false; start();
      });
  }
})();
</script>
